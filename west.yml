# West manifest for the MediaTek Genio Zephyr samples, release 1.0.
#
# This repository is the manifest repository of a T2 workspace
# (zephyr/doc/develop/west/workspaces.rst): it names the Zephyr tree the
# samples are built against, so one `west init -m` brings down the tree, its
# modules and these samples together and they cannot drift apart.
#
#   west init -m https://github.com/mtk-zephyr/samples --mr mtk-genio-v1.0.0 genio-workspace
#   cd genio-workspace && west update
#
# `revision` below pins the Genio tree to the tag mtk-genio-v1.0.0, so
# `west update` always gives the same tree.  On `main` of this repository the
# revision follows the development branch instead, which is rebased and
# force-pushed.
#
manifest:
  remotes:
    - name: mtk-zephyr
      url-base: https://github.com/mtk-zephyr

  projects:
    - name: mtk-zephyr
      description: MediaTek Genio Zephyr tree
      remote: mtk-zephyr
      revision: mtk-genio-v1.0.0
      path: zephyr
      # Brings in the HALs and modules the tree's own west.yml names.
      import: true

  self:
    path: samples
