# West manifest for the MediaTek Genio Zephyr samples.
#
# This repository is the manifest repository of a T2 workspace
# (zephyr/doc/develop/west/workspaces.rst): it names the Zephyr tree the
# samples are built against, so one `west init -m` brings down the tree, its
# modules and these samples together and they cannot drift apart.
#
#   west init -m https://github.com/mtk-zephyr/samples genio-workspace
#   cd genio-workspace && west update
#
# `revision` below selects which Genio tree you get.  It is the branch
# mtk-v4.5.0-next, the development line on Zephyr 4.5.0 and the default,
# where features land first.  The Genio branches are appended to and never
# rewritten, but a branch moves; pin a tag for anything you have to support.
# The other branches:
#
#   mtk-v4.5.0      the customer line on Zephyr 4.5.0, the line for the
#                   release tags from v26.1 on.
#   mtk-v4.4.2      the maintenance line on Zephyr 4.4.2.
#
manifest:
  remotes:
    - name: mtk-zephyr
      url-base: https://github.com/mtk-zephyr

  projects:
    - name: mtk-zephyr
      description: MediaTek Genio Zephyr tree
      remote: mtk-zephyr
      revision: mtk-v4.5.0-next
      path: zephyr
      # Brings in the HALs and modules the tree's own west.yml names.
      import: true

  self:
    path: samples
